<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket — every pound, printed</title>
<style>
  :root{
    --floor: #DAD5C8;
    --paper: #F1EDE2;
    --paper-shade: #E1DBCB;
    --ink: #211F1B;
    --ink-soft: #6C685C;
    --ink-faint: #99947F;
    --stamp-red: #8C2F24;
    --stamp-red-bright: #A63A2E;
    --money-green: #22513A;
    --gold: #8E6F27;
    --gold-soft: #EADFC0;
    --font-mono: ui-monospace, "SFMono-Regular", "Courier New", Courier, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--floor);
    font-family:var(--font-sans);
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:560px;margin:0 auto;}

  /* ---- receipt paper shell ---- */
  .receipt{
    background:var(--paper);
    box-shadow: 0 18px 40px -20px rgba(33,31,27,0.45), 0 2px 0 rgba(33,31,27,0.06);
    position:relative;
    padding:0 28px 8px;
  }
  .receipt::before, .receipt::after{
    content:"";
    display:block;
    height:14px;
    background-image:
      linear-gradient(135deg, var(--floor) 25%, transparent 25.5%),
      linear-gradient(225deg, var(--floor) 25%, transparent 25.5%);
    background-size:16px 16px;
    background-position:left top;
  }
  .receipt::after{ transform:scaleY(-1); }

  .tear{
    height:14px;
    margin:0 -28px;
    background: radial-gradient(circle, var(--floor) 3.2px, transparent 3.4px) repeat-x;
    background-size:16px 14px;
    background-position:center;
  }

  /* ---- header ---- */
  .masthead{ padding:26px 0 18px; text-align:center; }
  .wordmark{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:2rem;
    letter-spacing:0.24em;
    margin:0;
    padding-left:0.24em; /* balance letter-spacing */
  }
  .tagline{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:6px 0 14px;
    font-style:italic;
  }
  .clock{
    font-family:var(--font-mono);
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }

  /* ---- summary ---- */
  .summary{ padding:18px 0; }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:5px 0;
    font-family:var(--font-mono);
  }
  .summary-row .label{
    font-size:0.72rem;
    letter-spacing:0.12em;
    color:var(--ink-soft);
  }
  .summary-row .value{
    font-size:1.05rem;
    font-weight:700;
  }
  .summary-row.total .value{ color:var(--money-green); font-size:1.3rem; }
  .summary-row.total .label{ color:var(--ink); font-weight:600; }
  .summary-sub{
    font-size:0.72rem;
    color:var(--ink-faint);
    text-align:right;
    margin-top:-2px;
  }

  /* ---- form ---- */
  .form-section{ padding:20px 0 8px; }
  .form-title{
    font-size:0.72rem;
    letter-spacing:0.12em;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--paper-shade);
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--font-sans);
    font-size:0.8rem;
    padding:7px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip svg{ width:15px; height:15px; stroke:currentColor; flex:none; }
  .chip:hover{ border-color:var(--gold); }
  .chip.active{
    background:var(--gold-soft);
    border-color:var(--gold);
    color:var(--ink);
    font-weight:600;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:0.72rem;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field input[type="time"],
  .field select,
  .field textarea{
    width:100%;
    padding:9px 10px;
    background:#fff;
    border:1px solid var(--paper-shade);
    border-radius:var(--radius);
    font-family:var(--font-sans);
    font-size:0.92rem;
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:44px; font-family:var(--font-sans); }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }
  .row2{ display:flex; gap:12px; }
  .row2 .field{ flex:1; }
  .amount-wrap{ position:relative; }
  .amount-wrap .currency{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    font-family:var(--font-mono); color:var(--ink-soft); font-size:0.92rem;
  }
  .amount-wrap input{ padding-left:24px !important; font-family:var(--font-mono); }

  .print-btn{
    width:100%;
    padding:13px;
    margin-top:4px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:0.9rem;
    letter-spacing:0.08em;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  .print-btn:hover{ background:#3a372f; }
  .print-btn:active{ transform:scale(0.99); }
  .form-error{
    color:var(--stamp-red);
    font-size:0.78rem;
    margin-top:8px;
    min-height:1em;
  }

  /* ---- filter row ---- */
  .filter-row{
    padding:16px 0 4px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .filter-row input[type="search"]{
    flex:1;
    min-width:120px;
    padding:8px 10px;
    border:1px solid var(--paper-shade);
    border-radius:var(--radius);
    background:#fff;
    font-family:var(--font-sans);
    font-size:0.85rem;
  }
  .filter-select{
    padding:8px 10px;
    border:1px solid var(--paper-shade);
    border-radius:var(--radius);
    background:#fff;
    font-family:var(--font-sans);
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  /* ---- receipt roll of entries ---- */
  .roll{ padding:10px 0 6px; }
  .day-group{ margin-bottom:6px; }
  .day-head{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    padding:12px 0 6px;
    display:flex;
    justify-content:space-between;
  }
  .entry{
    display:grid;
    grid-template-columns:52px 1fr auto 28px;
    align-items:start;
    gap:10px;
    padding:8px 0;
    border-bottom:1px dashed var(--paper-shade);
  }
  .entry:last-child{ border-bottom:none; }
  .entry .time{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-faint);
    padding-top:2px;
  }
  .entry .desc .cat{
    font-size:0.9rem;
    font-weight:600;
  }
  .entry .desc .meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .entry .desc .notes{
    font-size:0.76rem;
    color:var(--ink-faint);
    font-style:italic;
    margin-top:2px;
  }
  .entry .amt{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:0.95rem;
    white-space:nowrap;
    padding-top:2px;
  }
  .void-btn{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-family:var(--font-mono);
    font-size:0.95rem;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .void-btn:hover{ color:var(--stamp-red); }
  .void-btn.confirming{
    color:var(--stamp-red-bright);
    font-size:0.62rem;
    font-weight:700;
    letter-spacing:0.03em;
    white-space:nowrap;
  }
  .empty-state{
    padding:28px 6px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.88rem;
  }
  .empty-state .stamp{
    font-family:var(--font-mono);
    color:var(--ink-faint);
    font-size:0.72rem;
    letter-spacing:0.1em;
    margin-top:6px;
  }

  /* ---- breakdown ---- */
  .breakdown{ padding:18px 0 10px; }
  .bd-row{ margin-bottom:10px; }
  .bd-label{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    margin-bottom:4px;
  }
  .bd-label .amt{ font-family:var(--font-mono); font-weight:600; }
  .bd-bar-track{
    height:7px;
    background:var(--paper-shade);
    border-radius:99px;
    overflow:hidden;
  }
  .bd-bar-fill{
    height:100%;
    background:var(--money-green);
    border-radius:99px;
  }

  .footer-note{
    text-align:center;
    font-size:0.7rem;
    color:var(--ink-faint);
    padding:18px 0 6px;
    font-family:var(--font-mono);
    letter-spacing:0.04em;
  }

  /* ---- account row (app screen) ---- */
  .account-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-faint);
    margin-top:4px;
  }
  .account-row .logout-link{
    background:none;
    border:none;
    color:var(--stamp-red);
    font-family:var(--font-mono);
    font-size:0.72rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ---- auth screen ---- */
  .auth-section{ padding:20px 0 10px; }
  .auth-tabs{
    display:flex;
    border:1px solid var(--paper-shade);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:18px;
  }
  .auth-tab{
    flex:1;
    padding:10px;
    text-align:center;
    background:transparent;
    border:none;
    font-family:var(--font-mono);
    font-size:0.78rem;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .auth-tab.active{
    background:var(--gold-soft);
    color:var(--ink);
    font-weight:700;
  }
  .auth-note{
    font-size:0.76rem;
    color:var(--ink-soft);
    margin:2px 0 16px;
    line-height:1.5;
  }
  .auth-submit{
    width:100%;
    padding:13px;
    margin-top:6px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-family:var(--font-mono);
    font-weight:700;
    font-size:0.9rem;
    letter-spacing:0.08em;
    cursor:pointer;
  }
  .auth-submit:hover{ background:#3a372f; }
  .auth-submit.secondary{ background:var(--money-green); }
  .auth-submit.secondary:hover{ background:#173f2d; }

  .password-input{
    min-height:52px;
    font-size:1.05rem;
    padding:12px 14px !important;
  }

  .auth-actions{ display:flex; justify-content:flex-end; margin-top:10px; }
  .forgot-link, .text-btn{
    background:none;
    border:none;
    color:var(--ink);
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    font-size:0.78rem;
    padding:0;
  }

  .reset-panel{ margin-top:18px; padding-top:10px; border-top:1px dashed var(--paper-shade); }
  .reset-actions{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }

  .auth-switch{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:14px;
  }
  .auth-switch button{
    background:none;
    border:none;
    color:var(--ink);
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    font-family:var(--font-sans);
    font-size:0.78rem;
    padding:0;
  }
  .auth-error{
    color:var(--stamp-red);
    font-size:0.78rem;
    margin-top:10px;
    min-height:1em;
  }
  .auth-error.success{
    color:var(--money-green);
  }

  button, input, select, textarea {
    font: inherit;
  }

  @media (max-width: 820px){
    body{ padding:20px 12px 52px; }
    .wrap{ max-width:680px; }
    .receipt{ padding:0 20px 8px; }
    .tear{ margin:0 -20px; }
    .wordmark{ letter-spacing:0.18em; }
    .summary-row .label{ letter-spacing:0.08em; }
  }

  @media (max-width: 620px){
    body{ padding:12px 8px 36px; }
    .wrap{ max-width:100%; }
    .receipt{ padding:0 14px 6px; }
    .tear{ margin:0 -14px; }
    .masthead{ padding-top:20px; }
    .wordmark{ font-size:clamp(1.5rem, 7vw, 2.1rem); letter-spacing:0.14em; }
    .tagline{ font-size:0.76rem; }
    .summary-row{ align-items:flex-start; gap:8px; }
    .summary-row .label{ font-size:0.66rem; }
    .summary-row .value{ font-size:0.96rem; }
    .summary-row.total .value{ font-size:1.15rem; }
    .row2{ flex-direction:column; gap:0; }
    .chips{ gap:6px; }
    .chip{ flex:1 1 calc(50% - 6px); justify-content:center; min-width:0; padding:8px 10px; }
    .field label{ font-size:0.68rem; }
    .field input[type="text"],
    .field input[type="number"],
    .field input[type="date"],
    .field input[type="time"],
    .field select,
    .field textarea{ font-size:1rem; padding:11px 10px; }
    .filter-row{ flex-direction:column; align-items:stretch; }
    .filter-row input[type="search"],
    .filter-select{ width:100%; }
    .entry{ grid-template-columns:42px 1fr auto 22px; gap:8px; }
    .entry .time{ font-size:0.66rem; }
    .entry .desc .cat{ font-size:0.85rem; }
    .entry .desc .meta{ font-size:0.74rem; }
    .entry .desc .notes{ font-size:0.7rem; }
    .entry .amt{ font-size:0.86rem; }
    .void-btn{ font-size:0.92rem; }
    .account-row{ flex-wrap:wrap; text-align:center; }
    .auth-tab{ font-size:0.72rem; letter-spacing:0.04em; }
    .social-btn{ min-height:46px; }
  }

  @media (max-width: 360px){
    body{ padding:10px 6px 28px; }
    .receipt{ padding:0 12px 4px; }
    .tear{ margin:0 -12px; }
    .chip{ flex-basis:100%; }
    .entry{ grid-template-columns:36px 1fr auto 18px; }
    .entry .time{ font-size:0.6rem; }
    .summary-row .label{ letter-spacing:0.06em; }
    .day-head{ letter-spacing:0.06em; font-size:0.66rem; }
  }

  @media (min-width: 1000px){
    .wrap{ max-width:760px; }
    .receipt{ box-shadow: 0 20px 48px -22px rgba(33,31,27,0.5), 0 2px 0 rgba(33,31,27,0.06); }
    .wordmark{ font-size:2.4rem; }
  }

  ::selection{ background:var(--gold-soft); }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div class="wrap" id="authWrap">
  <div class="receipt">

    <div class="masthead">
      <p class="wordmark">DOCKET</p>
      <p class="tagline">every pound, printed</p>
    </div>

    <div class="tear"></div>

    <div class="auth-section">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin">LOG IN</button>
        <button type="button" class="auth-tab" id="tabSignup">OPEN ACCOUNT</button>
      </div>

      <p class="auth-note" id="authIntro">Log in to see your own dockets — nobody else's spending shows up on your roll.</p>

      <div class="field">
        <label for="authUsername">Username</label>
        <input type="text" id="authUsername" autocomplete="username" placeholder="e.g. nabeel">
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" class="password-input" autocomplete="current-password" placeholder="at least 4 characters">
      </div>

      <button class="auth-submit" id="authSubmit">LOG IN</button>
      <div class="auth-actions"><button type="button" class="forgot-link" id="forgotPasswordBtn">Forgot password?</button></div>
      <div class="form-error" id="authError"></div>

      <div id="resetPanel" class="reset-panel" style="display:none;">
        <div class="field">
          <label for="resetUsername">Username</label>
          <input type="text" id="resetUsername" autocomplete="username" placeholder="your username">
        </div>
        <div class="field">
          <label for="resetPassword">New password</label>
          <input type="password" id="resetPassword" class="password-input" autocomplete="new-password" placeholder="new password">
        </div>
        <div class="field">
          <label for="resetConfirmPassword">Confirm new password</label>
          <input type="password" id="resetConfirmPassword" class="password-input" autocomplete="new-password" placeholder="repeat new password">
        </div>
        <div class="reset-actions">
          <button type="button" class="auth-submit secondary" id="resetSubmit">UPDATE PASSWORD</button>
          <button type="button" class="text-btn" id="cancelResetBtn">Cancel</button>
        </div>
      </div>
    </div>

    <p class="footer-note">— your account, your dockets —</p>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div class="wrap" id="appWrap" style="display:none;">
  <div class="receipt">

    <div class="masthead">
      <p class="wordmark">DOCKET</p>
      <p class="tagline">every pound, printed</p>
      <p class="clock" id="clock">—</p>
      <div class="account-row" id="accountRow"></div>
    </div>

    <div class="tear"></div>

    <div class="summary">
      <div class="summary-row total">
        <span class="label">TODAY</span>
        <span class="value" id="todayTotal">£0.00</span>
      </div>
      <div class="summary-row">
        <span class="label">THIS MONTH</span>
        <span class="value" id="monthTotal">£0.00</span>
      </div>
      <div class="summary-sub" id="monthMeta">0 dockets logged</div>
    </div>

    <div class="tear"></div>

    <div class="form-section">
      <p class="form-title">LOG A SPEND</p>

      <div class="chips" id="categoryChips"></div>

      <div class="field" id="providerField"></div>

      <div class="field">
        <label for="itemInput">What did you get?</label>
        <input type="text" id="itemInput" placeholder="e.g. milk, bread and eggs">
      </div>

      <div class="row2">
        <div class="field">
          <label for="amountInput">Amount</label>
          <div class="amount-wrap">
            <span class="currency">£</span>
            <input type="number" id="amountInput" step="0.01" min="0" placeholder="0.00">
          </div>
        </div>
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput">
        </div>
        <div class="field">
          <label for="timeInput">Time</label>
          <input type="time" id="timeInput">
        </div>
      </div>

      <div class="field">
        <label for="notesInput">Notes (optional)</label>
        <textarea id="notesInput" placeholder="anything worth remembering about this one"></textarea>
      </div>

      <button class="print-btn" id="printBtn">PRINT ENTRY</button>
      <div class="form-error" id="formError"></div>
    </div>

    <div class="tear"></div>

    <div class="filter-row">
      <input type="search" id="searchInput" placeholder="Search dockets…">
      <select class="filter-select" id="filterCategory">
        <option value="">All categories</option>
      </select>
    </div>

    <div class="roll" id="roll"></div>

    <div class="tear"></div>

    <div class="breakdown" id="breakdown">
      <p class="form-title">THIS MONTH, BY CATEGORY</p>
      <div id="breakdownBody"></div>
    </div>

    <p class="footer-note">— end of docket —</p>
  </div>
</div>
<!-- ============ /APP SCREEN ============ -->

<script>
(function(){

  /* ================================================================
     API CONFIG
     ----------------------------------------------------------------
     Docket's frontend talks to the docket-backend server for
     everything — accounts, sessions and dockets. Nothing is stored
     in the browser itself.

     Leave API_BASE as '' if this file is served BY the backend
     (server.js does this by default — see backend/server.js).

     If you host the frontend separately from the API, set API_BASE
     to the backend's full URL, e.g.
     const API_BASE = 'https://api.yourdomain.com';
     and make sure CLIENT_ORIGIN in the backend's .env matches the
     URL this frontend is actually served from.
     ================================================================ */
  const API_BASE = (window.location && window.location.origin) ? window.location.origin : 'http://localhost:4000';

  async function api(path, options){
    options = options || {};
    const res = await fetch(API_BASE + path, Object.assign({
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' }
    }, options));
    let body = null;
    try{ body = await res.json(); }catch(e){ /* no body */ }
    if(!res.ok){
      const message = (body && body.error) ? body.error : 'Something went wrong talking to the server.';
      throw new Error(message);
    }
    return body;
  }

  /* ---------------- category data ---------------- */
  const ICONS = {
    house: 'M3 11l9-7 9 7M5 10v9h5v-5h4v5h5v-9',
    basket: 'M4 9h16l-1.5 9.2A2 2 0 0 1 16.5 20h-9a2 2 0 0 1-2-1.8L4 9Zm4 0V7a4 4 0 0 1 8 0v2',
    cup: 'M4 3h11v9a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V3Zm11 3h2a2 2 0 0 1 0 4h-2M6 20h8',
    shirt: 'M8 3 12 5l4-2 3 4-3 2v10H8V9L5 7Z',
    bus: 'M4 5h16v11H4zM4 14h16M7 19v-2M17 19v-2M7 8h4M13 8h4',
    bolt: 'M13 3 5 14h6l-1 7 9-11h-6z',
    loop: 'M4 12a8 8 0 0 1 13.7-5.7L20 8M20 12a8 8 0 0 1-13.7 5.7L4 16M17 4v4h-4M7 20v-4h4',
    ticket: 'M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Zm9-2v12',
    dot: 'M12 5v14M5 12h14'
  };

  function iconSvg(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="' + ICONS[name] + '"/></svg>';
  }

  const OTHER_TAG = '__other__';

  const CATEGORIES = [
    { id:'rent', label:'Rent', icon:'house', providerLabel:'Landlord / letting agent', providerType:'text', optional:true },
    { id:'groceries', label:'Groceries', icon:'basket', providerLabel:'Supermarket', providerType:'select',
      options:["Tesco","Sainsbury's","ASDA","Aldi","Lidl","Morrisons","Waitrose","Co-op","Iceland","M&S Food","Farmfoods","Home Bargains","Costco"] },
    { id:'dining', label:'Dining out', icon:'cup', providerLabel:'Restaurant / café', providerType:'select',
      options:["Greggs","Nando's","McDonald's","KFC","Burger King","Costa Coffee","Starbucks","Pret A Manger","Wagamama","Domino's Pizza","Subway","Deliveroo","Uber Eats","Just Eat","Local café or restaurant"] },
    { id:'clothing', label:'Clothing', icon:'shirt', providerLabel:'Shop', providerType:'select',
      options:["Primark","H&M","Zara","Next","ASOS","Uniqlo","TK Maxx","River Island","New Look","Boohoo","Marks & Spencer","JD Sports"] },
    { id:'travel', label:'Travel', icon:'bus', providerLabel:'Mode of transport', providerType:'select',
      options:["Local bus","National Express coach","National Rail / Trainline","TfL Tube (Oyster/contactless)","TfL Bus (Oyster/contactless)","Uber","Bolt","FreeNow taxi","Voi e-scooter","Lime e-scooter","Tier e-scooter","Neuron e-scooter","Santander Cycles","Own car — fuel","Parking"] },
    { id:'utilities', label:'Utilities & bills', icon:'bolt', providerLabel:'Provider', providerType:'select',
      options:["British Gas","EDF Energy","E.ON Next","Octopus Energy","Scottish Power","Thames Water","Council Tax","TV Licence","BT Broadband","Virgin Media","Sky Broadband","EE","O2","Vodafone","Three"] },
    { id:'subscriptions', label:'Subscriptions', icon:'loop', providerLabel:'Service', providerType:'select',
      options:["Netflix","Spotify","Amazon Prime","Disney+","Gym membership","Students' Union / society","Phone contract","YouTube Premium","Apple services"] },
    { id:'entertainment', label:'Entertainment', icon:'ticket', providerLabel:'Venue / activity', providerType:'select',
      options:["Cinema (Vue / Odeon / Cineworld)","Concert or gig","Bowling","Nightclub / bar","Steam / PlayStation / Xbox","Museum / exhibition","Sports event"] },
    { id:'other', label:'Other', icon:'dot', providerLabel:'What / who', providerType:'text', optional:true }
  ];

  const catById = {};
  CATEGORIES.forEach(c => catById[c.id] = c);

  /* ---------------- state ---------------- */
  let entries = [];
  let selectedCategory = 'groceries';
  let confirmingVoidId = null;
  let confirmTimer = null;
  let currentUser = null;      // { username, displayName, provider }
  let authMode = 'login';      // 'login' | 'signup'

  /* ---------------- entries via the API ---------------- */
  async function loadEntries(){
    try{
      const body = await api('/api/entries');
      return (body && Array.isArray(body.entries)) ? body.entries : [];
    }catch(e){
      return [];
    }
  }

  async function persistNewEntry(entry){
    const body = await api('/api/entries', { method:'POST', body: JSON.stringify(entry) });
    return body.entry;
  }

  async function deleteEntryRemote(id){
    await api('/api/entries/' + id, { method:'DELETE' });
  }

  /* ---------------- helpers ---------------- */
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function nowTimeStr(){
    const d = new Date();
    return pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function monthStr(dateStr){ return dateStr.slice(0,7); }
  function money(n){
    return '£' + n.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function dayLabel(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    return days[d.getDay()] + ' ' + pad(d.getDate()) + ' ' + months[d.getMonth()];
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ---------------- clock ---------------- */
  function tickClock(){
    const d = new Date();
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const str = days[d.getDay()]+' '+pad(d.getDate())+' '+months[d.getMonth()]+' '+d.getFullYear()+' · '+pad(d.getHours())+':'+pad(d.getMinutes());
    document.getElementById('clock').textContent = str;
  }

  /* ---------------- render: category chips ---------------- */
  function renderChips(){
    const wrap = document.getElementById('categoryChips');
    wrap.innerHTML = CATEGORIES.map(c =>
      '<button type="button" class="chip'+(c.id===selectedCategory?' active':'')+'" data-cat="'+c.id+'">'
      + iconSvg(c.icon) + '<span>' + c.label + '</span></button>'
    ).join('');
    wrap.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        selectedCategory = btn.getAttribute('data-cat');
        renderChips();
        renderProviderField();
      });
    });
  }

  function renderProviderField(){
    const cat = catById[selectedCategory];
    const field = document.getElementById('providerField');
    if(cat.providerType === 'text'){
      field.innerHTML =
        '<label for="providerInput">'+cat.providerLabel+(cat.optional?' (optional)':'')+'</label>'+
        '<input type="text" id="providerInput" placeholder="type here">';
    } else {
      const opts = cat.options.map(o => '<option value="'+escapeHtml(o)+'">'+escapeHtml(o)+'</option>').join('');
      field.innerHTML =
        '<label for="providerInput">'+cat.providerLabel+'</label>'+
        '<select id="providerInput"><option value="">Choose one…</option>'+opts+'<option value="'+OTHER_TAG+'">Other…</option></select>'+
        '<div id="otherWrap" style="margin-top:8px; display:none;">'+
        '<input type="text" id="otherProviderInput" placeholder="name it">'+
        '</div>';
      document.getElementById('providerInput').addEventListener('change', function(){
        const otherWrap = document.getElementById('otherWrap');
        otherWrap.style.display = this.value === OTHER_TAG ? 'block' : 'none';
      });
    }
  }

  function getProviderValue(){
    const cat = catById[selectedCategory];
    if(cat.providerType === 'text'){
      const el = document.getElementById('providerInput');
      return el ? el.value.trim() : '';
    }
    const sel = document.getElementById('providerInput');
    if(!sel) return '';
    if(sel.value === OTHER_TAG){
      const o = document.getElementById('otherProviderInput');
      return o ? o.value.trim() : '';
    }
    return sel.value;
  }

  /* ---------------- add entry ---------------- */
  function resetDateTime(){
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('timeInput').value = nowTimeStr();
  }

  async function addEntry(){
    const errorEl = document.getElementById('formError');
    errorEl.textContent = '';

    const cat = catById[selectedCategory];
    const provider = getProviderValue();
    const item = document.getElementById('itemInput').value.trim();
    const amountRaw = document.getElementById('amountInput').value;
    const date = document.getElementById('dateInput').value;
    const time = document.getElementById('timeInput').value;
    const notes = document.getElementById('notesInput').value.trim();

    const amount = parseFloat(amountRaw);
    if(isNaN(amount) || amount <= 0){
      errorEl.textContent = 'Add an amount greater than £0.00 before printing.';
      return;
    }
    if(!date || !time){
      errorEl.textContent = 'Date and time are needed for the docket.';
      return;
    }
    if(cat.providerType === 'select' && !provider){
      errorEl.textContent = 'Choose or name a ' + cat.providerLabel.toLowerCase() + '.';
      return;
    }

    try{
      const saved = await persistNewEntry({
        category: cat.id,
        provider: provider,
        item: item,
        amount: Math.round(amount*100)/100,
        date: date,
        time: time,
        notes: notes
      });
      entries.push(saved);
    }catch(e){
      errorEl.textContent = e.message;
      return;
    }

    document.getElementById('itemInput').value = '';
    document.getElementById('amountInput').value = '';
    document.getElementById('notesInput').value = '';
    if(cat.providerType === 'text'){
      const p = document.getElementById('providerInput');
      if(p) p.value = '';
    } else {
      renderProviderField();
    }
    resetDateTime();

    renderAll();
  }

  /* ---------------- void entry (two-step confirm) ---------------- */
  function onVoidClick(id){
    if(confirmingVoidId === id){
      clearTimeout(confirmTimer);
      confirmingVoidId = null;
      deleteEntryRemote(id).then(()=>{
        entries = entries.filter(e => e.id !== id);
        renderAll();
      }).catch(()=>{
        renderRoll();
      });
    } else {
      confirmingVoidId = id;
      renderRoll();
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(()=>{
        confirmingVoidId = null;
        renderRoll();
      }, 3000);
    }
  }

  /* ---------------- summary ---------------- */
  function renderSummary(){
    const today = todayStr();
    const thisMonth = today.slice(0,7);

    const todaySum = entries.filter(e=>e.date===today).reduce((s,e)=>s+e.amount,0);
    const monthEntries = entries.filter(e=>monthStr(e.date)===thisMonth);
    const monthSum = monthEntries.reduce((s,e)=>s+e.amount,0);

    document.getElementById('todayTotal').textContent = money(todaySum);
    document.getElementById('monthTotal').textContent = money(monthSum);
    document.getElementById('monthMeta').textContent = monthEntries.length + (monthEntries.length===1?' docket logged':' dockets logged');
  }

  /* ---------------- breakdown ---------------- */
  function renderBreakdown(){
    const thisMonth = todayStr().slice(0,7);
    const monthEntries = entries.filter(e=>monthStr(e.date)===thisMonth);
    const totals = {};
    monthEntries.forEach(e=>{ totals[e.category] = (totals[e.category]||0) + e.amount; });
    const rows = Object.keys(totals).map(id=>({id, sum: totals[id]})).sort((a,b)=>b.sum-a.sum);

    const body = document.getElementById('breakdownBody');
    if(rows.length===0){
      body.innerHTML = '<div class="empty-state" style="padding:8px 0;">Nothing printed for this month yet.</div>';
      return;
    }
    const max = rows[0].sum;
    body.innerHTML = rows.map(r=>{
      const cat = catById[r.id];
      const pct = Math.max(4, Math.round((r.sum/max)*100));
      return '<div class="bd-row">'
        + '<div class="bd-label"><span>'+cat.label+'</span><span class="amt">'+money(r.sum)+'</span></div>'
        + '<div class="bd-bar-track"><div class="bd-bar-fill" style="width:'+pct+'%"></div></div>'
        + '</div>';
    }).join('');
  }

  /* ---------------- filter controls ---------------- */
  function populateFilterOptions(){
    const sel = document.getElementById('filterCategory');
    sel.innerHTML = '<option value="">All categories</option>' +
      CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.label+'</option>').join('');
  }

  /* ---------------- roll of entries ---------------- */
  function renderRoll(){
    const roll = document.getElementById('roll');
    const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    const filterCat = document.getElementById('filterCategory').value;

    let list = entries.filter(e=>{
      if(filterCat && e.category !== filterCat) return false;
      if(search){
        const hay = (e.provider+' '+e.item+' '+e.notes+' '+catById[e.category].label).toLowerCase();
        if(hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    if(list.length === 0){
      roll.innerHTML = '<div class="empty-state">No dockets match yet.<div class="stamp">— try clearing your search —</div></div>';
      return;
    }

    // group by date
    const byDate = {};
    list.forEach(e=>{
      if(!byDate[e.date]) byDate[e.date] = [];
      byDate[e.date].push(e);
    });
    const dates = Object.keys(byDate).sort().reverse();

    let html = '';
    dates.forEach(date=>{
      const dayEntries = byDate[date].slice().sort((a,b)=> a.time < b.time ? 1 : -1);
      const dayTotal = dayEntries.reduce((s,e)=>s+e.amount,0);
      html += '<div class="day-group">';
      html += '<div class="day-head"><span>'+dayLabel(date)+'</span><span>'+money(dayTotal)+'</span></div>';
      dayEntries.forEach(e=>{
        const cat = catById[e.category];
        const metaParts = [];
        if(e.provider) metaParts.push(escapeHtml(e.provider));
        if(e.item) metaParts.push(escapeHtml(e.item));
        const isConfirming = confirmingVoidId === e.id;
        html += '<div class="entry">'
          + '<div class="time">'+e.time+'</div>'
          + '<div class="desc"><div class="cat">'+cat.label+'</div>'
          + (metaParts.length ? '<div class="meta">'+metaParts.join(' — ')+'</div>' : '')
          + (e.notes ? '<div class="notes">'+escapeHtml(e.notes)+'</div>' : '')
          + '</div>'
          + '<div class="amt">'+money(e.amount)+'</div>'
          + '<button class="void-btn'+(isConfirming?' confirming':'')+'" data-void="'+e.id+'" title="Void this docket">'+(isConfirming?'SURE?':'×')+'</button>'
          + '</div>';
      });
      html += '</div>';
    });

    roll.innerHTML = html;

    roll.querySelectorAll('[data-void]').forEach(btn=>{
      btn.addEventListener('click', ()=> onVoidClick(btn.getAttribute('data-void')));
    });
  }

  /* ---------------- master render ---------------- */
  function renderAll(){
    renderSummary();
    renderRoll();
    renderBreakdown();
  }

  /* ---------------- account row ---------------- */
  function renderAccountRow(){
    document.getElementById('accountRow').innerHTML =
      'Logged in as <strong>'+escapeHtml(currentUser.displayName)+'</strong> &nbsp;·&nbsp; '
      + '<button class="logout-link" id="logoutBtn">Log out</button>';
    document.getElementById('logoutBtn').addEventListener('click', logout);
  }

  /* ---------------- auth screen wiring ---------------- */
  function setAuthMode(mode){
    authMode = mode;
    const resetPanel = document.getElementById('resetPanel');
    const forgotBtn = document.getElementById('forgotPasswordBtn');
    document.getElementById('tabLogin').classList.toggle('active', mode==='login');
    document.getElementById('tabSignup').classList.toggle('active', mode==='signup');
    document.getElementById('authSubmit').textContent = mode==='login' ? 'LOG IN' : 'OPEN ACCOUNT';
    document.getElementById('authIntro').textContent = mode==='login'
      ? 'Log in to see your own dockets — nobody else\'s spending shows up on your roll.'
      : 'Pick a username and password. This opens a fresh, empty roll just for you.';
    document.getElementById('authError').textContent = '';
    document.getElementById('authError').classList.remove('success');
    resetPanel.style.display = 'none';
    forgotBtn.style.display = mode === 'login' ? 'inline' : 'none';
  }

  function showAuthMessage(message, isSuccess){
    const errorEl = document.getElementById('authError');
    errorEl.textContent = message || '';
    errorEl.classList.toggle('success', Boolean(isSuccess));
  }

  async function handleAuthSubmit(){
    const errorEl = document.getElementById('authError');
    errorEl.textContent = '';
    errorEl.classList.remove('success');
    const rawUsername = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;

    if(!rawUsername || !password){
      errorEl.textContent = 'Enter a username and password.';
      return;
    }
    if(password.length < 4){
      errorEl.textContent = 'Password needs to be at least 4 characters.';
      return;
    }

    try{
      const path = authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
      const body = await api(path, {
        method: 'POST',
        body: JSON.stringify({ username: rawUsername, password: password, displayName: rawUsername })
      });
      await completeLogin(body.user);
    }catch(e){
      errorEl.textContent = e.message;
    }
  }

  async function handlePasswordReset(){
    const errorEl = document.getElementById('authError');
    const username = document.getElementById('resetUsername').value.trim();
    const newPassword = document.getElementById('resetPassword').value;
    const confirmPassword = document.getElementById('resetConfirmPassword').value;

    errorEl.textContent = '';
    errorEl.classList.remove('success');
    if(!username || !newPassword || !confirmPassword){
      errorEl.textContent = 'Fill in your username and both password fields.';
      return;
    }
    if(newPassword.length < 4){
      errorEl.textContent = 'New password needs to be at least 4 characters.';
      return;
    }
    if(newPassword !== confirmPassword){
      errorEl.textContent = 'The new password and confirmation do not match.';
      return;
    }

    try{
      const body = await api('/api/auth/forgot-password', {
        method: 'POST',
        body: JSON.stringify({ username, newPassword })
      });
      document.getElementById('resetPanel').style.display = 'none';
      document.getElementById('resetUsername').value = '';
      document.getElementById('resetPassword').value = '';
      document.getElementById('resetConfirmPassword').value = '';
      setAuthMode('login');
      showAuthMessage(body.message || 'Your password has been changed successfully.', true);
    }catch(e){
      errorEl.textContent = e.message;
      errorEl.classList.remove('success');
    }
  }

  async function completeLogin(user){
    currentUser = user; // { username, displayName, provider }
    document.getElementById('authUsername').value = '';
    document.getElementById('authPassword').value = '';
    document.getElementById('authWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    renderAccountRow();
    entries = await loadEntries();
    renderAll();
  }

  async function logout(){
    try{ await api('/api/auth/logout', { method:'POST' }); }catch(e){ /* non-fatal */ }
    currentUser = null;
    entries = [];
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('authWrap').style.display = 'block';
    setAuthMode('login');
  }

  /* ---------------- init ---------------- */
  async function init(){
    populateFilterOptions();
    renderChips();
    renderProviderField();
    resetDateTime();
    tickClock();
    setInterval(tickClock, 15000);

    document.getElementById('printBtn').addEventListener('click', addEntry);
    document.getElementById('searchInput').addEventListener('input', renderRoll);
    document.getElementById('filterCategory').addEventListener('change', renderRoll);

    document.getElementById('tabLogin').addEventListener('click', ()=>setAuthMode('login'));
    document.getElementById('tabSignup').addEventListener('click', ()=>setAuthMode('signup'));
    document.getElementById('authSubmit').addEventListener('click', handleAuthSubmit);
    document.getElementById('authPassword').addEventListener('keydown', function(e){
      if(e.key === 'Enter') handleAuthSubmit();
    });
    document.getElementById('forgotPasswordBtn').addEventListener('click', function(){
      const panel = document.getElementById('resetPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      document.getElementById('authError').textContent = '';
    });
    document.getElementById('resetSubmit').addEventListener('click', handlePasswordReset);
    document.getElementById('cancelResetBtn').addEventListener('click', function(){
      document.getElementById('resetPanel').style.display = 'none';
      document.getElementById('authError').textContent = '';
    });

    // Already got a valid session cookie from a previous visit? Skip straight in.
    try{
      const body = await api('/api/auth/me');
      if(body && body.user){
        await completeLogin(body.user);
        return;
      }
    }catch(e){ /* not logged in — show the auth screen */ }

    setAuthMode('login');
  }

  init();
})();
</script>
</body>
